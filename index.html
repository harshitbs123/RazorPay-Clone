<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Dosis:wght@200..800&family=Smooch+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>RazorPay Clone</title>
  </head>
  <body>
    <nav
      class="sticky top-0 z-50 bg-white/50 backdrop-blur-md border-b border-gray-200/50"
    >
      <nav
        class="h-[74px] w-[1184px] mx-auto flex items-center justify-between gap-x-1"
      >
        <img src="assets/Razorpay_logo.svg" alt="" class="h-[28.6px]" />
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Agentic Stack
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Payments
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Banking+
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Payroll
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Engage
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Partners
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Resources
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <a
          href="#"
          class="relative inline-block group text-gray-600 hover:text-black text-sm"
        >
          Pricing
          <span
            class="absolute left-0 -bottom-2 h-[2px] w-full bg-blue-700 scale-x-0 origin-left transition-transform duration-300 ease-out group-hover:scale-x-100"
          >
          </span>
        </a>
        <i
          class="fa-solid fa-headphones cursor-pointer hover:text-blue-600 cursor-pointer"
        ></i>
        <img
          src="assets/Flag_of_India.svg.png"
          alt=""
          class="h-[12px] cursor-pointer"
        />
        <button class="border p-2 text-blue-700 rounded-lg cursor-pointer px-4">
          Login
        </button>
        <button
          class="border p-2 rounded-lg cursor-pointer bg-blue-600 px-4 text-amber-50 hover:bg-blue-800"
        >
          Sign Up <i class="fa-solid fa-arrow-right"></i>
        </button>
      </nav>
    </nav>

    <!-- down -->

    <div class="w-[1184px] mb-15 mx-auto">
      <div class="flex items-center">
        <!-- up left -->
        <div class="w-[680px] m-4">
          <p class="text-5xl text-blue-700 font-semibold my-2">
            One Stop In-Store Payments
          </p>
          <p class="text-5xl font-semibold my-3">
            For India's Boldest Disruptors
          </p>
          <p>
            Quickest payments / No Seamless Integration / Top Tier Upi Stack
          </p>
          <p class="">
            <button
              class="m-2 border p-2 rounded-lg cursor-pointer bg-blue-600 px-4 text-amber-50 hover:bg-blue-800"
            >
              Sign Up <i class="fa-solid fa-arrow-right"></i>
            </button>
            <a
              href="#"
              class="relative inline-block group font-semibold text-blue-500 ml-4"
            >
              Know More
              <span
                class="absolute left-1/2 -translate-x-1/2 -bottom-2 h-[2px] w-full bg-gray-300 scale-x-0 origin-center transition-transform duration-300 ease-out group-hover:scale-x-100"
              >
              </span>
            </a>
          </p>
        </div>
        <!-- up right -->
        <div class="w-[600px] h-[620px] relative overflow-hidden">
          <img
            src="assets/COBl8AoJHIT0OeKMgtEUONygjGQ.avif"
            class="absolute bottom-0 right-0 max-h-full object-contain"
          />
        </div>
      </div>
      <!-- bar -->
      <div
        class="w-[1184px] h-[74px] shadow-md flex justify-between items-center"
      >
        <!-- LEFT SIDE -->
        <div class="flex items-center gap-2 pl-2">
          <i class="fa-solid fa-paper-plane text-blue-700"></i>
          <span class="text-sm">Class Recommendations</span>
        </div>

        <!-- RIGHT SIDE -->
        <div class="flex justify-end gap-4 p-4">
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-solid fa-cart-shopping"></i>&nbsp;Accept Payments
          </button>
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-regular fa-money-bill-1"></i> &nbsp;Make Payouts
          </button>
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-solid fa-building-columns"></i>&nbsp;Start Business
            Banking
          </button>
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl py-2 hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-regular fa-credit-card"></i>
            &nbsp;Get Credit
          </button>
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-solid fa-coins"></i>&nbsp;Automate Payroll
          </button>
          <button
            class="cursor-pointer text-sm bg-gray-200 text-blue-500 px-2 rounded-3xl mx-2 hover:text-white hover:bg-blue-500 transition duration-500"
          >
            <i class="fa-regular fa-pen-to-square"></i> &nbsp; Something Else?
          </button>
        </div>
      </div>
    </div>

    <!-- Stirp -->

    <div class="relative overflow-hidden w-full py-10 bg-gray-50">
      <div
        class="absolute left-0 top-0 h-full w-20 bg-gradient-to-r from-white to-transparent z-10"
      ></div>
      <div
        class="absolute right-0 top-0 h-full w-20 bg-gradient-to-l from-white to-transparent z-10"
      ></div>

      <div class="flex gap-20 animate-scroll whitespace-nowrap">
        <!-- logos -->
        <img src="assets/blinkit.png" class="h-8" />
        <img src="assets/Nykaa_New_Logo.svg" class="h-8" />
        <img src="assets/Razorpay_logo.svg" class="h-8" />
        <img src="assets/Swiggy_logo_(old).svg.png" class="h-8" />
        <img src="assets/Zepto_Logo.svg.png" class="h-8" />
        <img src="assets/Zomato_Logo.svg.png" class="h-8" />

        <!-- duplicate for seamless loop -->
        <img src="assets/blinkit.png" class="h-8" />
        <img src="assets/Nykaa_New_Logo.svg" class="h-8" />
        <img src="assets/Razorpay_logo.svg" class="h-8" />
        <img src="assets/Swiggy_logo_(old).svg.png" class="h-8" />
        <img src="assets/Zepto_Logo.svg.png" class="h-8" />
        <img src="assets/Zomato_Logo.svg.png" class="h-8" />
      </div>
    </div>
    <!-- sprint -->
    <div class="mt-20">
      <img src="assets/framerWYoR9VIihk6GZ9yEWNgoXNHs.avif" alt="" class="h-[320px] mx-auto" >
    </div>
  </body>
</html>
